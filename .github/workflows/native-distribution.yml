name: Native project distribution
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/ci_thread_dump.py'
      - 'tests/test_ci_thread_dump*.py'
      - 'src/polymarket_alpha_lab/research_paper*.py'
      - 'tests/test_research_paper*.py'
      - 'docs/research-paper.md'
      - 'docs/research-paper-settlement.md'
      - 'tests/packaged_session_drain.py'
      - 'tests/packaged_research_flow.py'
      - 'tests/test_packaged_research_flow*.py'
      - 'tests/project_entry_root_probe.py'
      - 'tests/test_project_entry_roots*.py'
      - 'tests/test_project_quickstart.py'
      - 'src/polymarket_alpha_lab/research_model_budget*.py'
      - 'tests/test_research_model_budget.py'
      - 'tests/test_project_postgres_budget_native.py'
      - 'docs/research-model-budget.md'
      - 'src/polymarket_alpha_lab/research_dispatch*.py'
      - 'tests/test_research_dispatch_rotation.py'
      - 'tests/test_research_dispatch_cli*.py'
      - 'scripts/manage_research_tasks.py'
      - 'docs/research-dispatch.md'
      - 'src/polymarket_alpha_lab/research_resolution_confirmation*.py'
      - 'tests/test_research_resolution_confirmation*.py'
      - 'scripts/review_resolution_queue.py'
      - 'docs/research-resolution-queue.md'
      - 'src/polymarket_alpha_lab/research_crypto_selection.py'
      - 'tests/test_crypto_supported_selection.py'
      - 'scripts/discover_crypto_research.py'
      - 'docs/research-crypto-discovery.md'
      - 'src/polymarket_alpha_lab/research_resolution_inspection_cli.py'
      - 'scripts/inspect_project_resolution.py'
      - 'tests/test_research_resolution_inspection_cli.py'
      - 'docs/research-resolution-inspection.md'
      - 'src/polymarket_alpha_lab/project_postgres/**'
      - 'src/polymarket_alpha_lab/research_execution_inventory.py'
      - 'src/polymarket_alpha_lab/research_inventory_cli.py'
      - 'scripts/list_project_research.py'
      - 'tests/test_research_execution_inventory.py'
      - 'tests/test_research_inventory_cli.py'
      - 'docs/research-execution-inventory.md'
      - 'src/polymarket_alpha_lab/research_execution_cli.py'
      - 'scripts/inspect_project_research.py'
      - 'tests/test_research_execution_cli.py'
      - 'docs/research-execution-inspection.md'
      - 'src/polymarket_alpha_lab/research_evaluation_cli.py'
      - 'scripts/evaluate_project_research.py'
      - 'tests/test_research_evaluation_cli.py'
      - 'docs/research-evaluation-console.md'
      - 'src/polymarket_alpha_lab/team_research_intake.py'
      - 'src/polymarket_alpha_lab/team_research_market_pipeline.py'
      - 'src/polymarket_alpha_lab/team_research_agent.py'
      - 'src/polymarket_alpha_lab/research_record_values.py'
      - 'src/polymarket_alpha_lab/research_capture_codec.py'
      - 'src/polymarket_alpha_lab/research_execution.py'
      - 'src/polymarket_alpha_lab/team_research_evaluation.py'
      - 'scripts/start_project.py'
      - 'scripts/build_project_bundle.py'
      - 'tests/test_project_postgres*'
      - 'database/**'
      - 'supabase/migrations/**'
      - '.github/workflows/native-distribution.yml'
permissions:
  contents: read
concurrency:
  group: native-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-kit:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install locked test environment
        run: uv sync --locked --extra dev --extra postgres --python 3.12
      - name: Build and prove the actual Windows distribution
        shell: pwsh
        run: |
          $env:POLYMARKET_ALPHA_LAB_NATIVE_PG_PREFIX = 'C:\Program Files\PostgreSQL\17'
          $env:POLYMARKET_ALPHA_LAB_RUN_NATIVE_DISTRIBUTION = '1'
          $env:POLYMARKET_ALPHA_LAB_DISTRIBUTION_OUTPUT = "$env:RUNNER_TEMP/polymarket-windows-native.zip"
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONUTF8 = '1'
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PG*' } | ForEach-Object { Remove-Item ('Env:' + $_.Name) }
          .\.venv\Scripts\python.exe -u -m pytest -p no:faulthandler -p tests.ci_thread_dump -q -s -o faulthandler_timeout=180 tests/test_project_postgres_distribution.py tests/test_project_postgres_bootstrap.py tests/test_project_postgres_native_spawn.py tests/test_project_postgres_distribution_native.py tests/test_project_entry_roots.py tests/test_project_entry_roots_review.py tests/test_project_quickstart.py tests/test_packaged_research_flow.py tests/test_packaged_research_flow_review.py tests/test_project_postgres_session_drain.py tests/test_project_postgres_session_drain_review.py --junitxml="$env:RUNNER_TEMP/distribution-proof.xml" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/distribution-proof.log"
          exit $LASTEXITCODE
      - name: Confirm tracked source unchanged
        run: |
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: distribution-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-proof.log
            ${{ runner.temp }}/distribution-proof.xml
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: windows-native-kit-${{ github.sha }}
          path: ${{ runner.temp }}/polymarket-windows-native.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

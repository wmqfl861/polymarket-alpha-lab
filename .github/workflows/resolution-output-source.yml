name: Resolution output pinned source
on:
  push:
    branches: [review/wp06-resolution-output-source-20260916]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1ac3ec6b1ec0de18faa1e0227076b14075525ec7
          persist-credentials: false
      - name: Archive exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1ac3ec6b1ec0de18faa1e0227076b14075525ec7
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
          sha256sum "$RUNNER_TEMP/source.zip" > "$RUNNER_TEMP/source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-1ac3ec6b
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source.sha256
          retention-days: 7
          if-no-files-found: error

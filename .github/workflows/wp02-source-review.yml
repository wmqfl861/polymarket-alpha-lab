name: WP02 pinned source review
on:
  push:
    branches: ['audit/wp02-local-cli-source-20260919']
    paths: ['.github/workflows/wp02-source-review.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8ae2933a843c554b0f4391b4faeb572b2f6b952c
          persist-credentials: false
          path: project
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/codex
          ref: be2951ea34f0d295ed0becf97079f92fa5f6950e
          persist-credentials: false
          path: upstream
      - name: Export committed source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp02-reference"
          test "$(git -C project rev-parse HEAD^{tree})" = 1061c4492de3378d00fb1e55179da2e539e36ca4
          test "$(git -C upstream rev-parse HEAD)" = be2951ea34f0d295ed0becf97079f92fa5f6950e
          git -C project archive --format=tar.gz HEAD > "$RUNNER_TEMP/wp02-reference/project.tar.gz"
          git -C project ls-tree -rz --full-tree HEAD > "$RUNNER_TEMP/wp02-reference/project-tree.z"
          git -C project cat-file commit HEAD > "$RUNNER_TEMP/wp02-reference/project-commit.txt"
          git -C upstream archive --format=tar.gz HEAD > "$RUNNER_TEMP/wp02-reference/codex-source.tar.gz"
          git -C upstream rev-parse HEAD^{tree} > "$RUNNER_TEMP/wp02-reference/codex-tree.txt"
      - name: Download official pinned CLI binary for later isolated synthetic testing only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wp02-reference'
          url = 'https://api.github.com/repos/openai/codex/releases/tags/rust-v0.155.1'
          with urllib.request.urlopen(url, timeout=60) as response:
              release = json.load(response)
          wanted = 'codex-x86_64-unknown-linux-musl.tar.gz'
          asset, = [a for a in release['assets'] if a['name'] == wanted]
          with urllib.request.urlopen(asset['browser_download_url'], timeout=120) as response:
              data = response.read(200_000_001)
          assert len(data) == asset['size'] and len(data) <= 200_000_000
          assert 'sha256:' + hashlib.sha256(data).hexdigest() == asset['digest']
          (root / wanted).write_bytes(data)
          (root / 'codex-asset.json').write_text(json.dumps({k: asset[k] for k in ('id', 'name', 'size', 'digest', 'browser_download_url')}, indent=2))
          PY
          cd "$RUNNER_TEMP/wp02-reference"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp02-reference-8ae2933-codex-0.155.1
          path: ${{ runner.temp }}/wp02-reference/
          retention-days: 7
          if-no-files-found: error

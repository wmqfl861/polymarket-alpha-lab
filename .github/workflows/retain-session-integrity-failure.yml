name: Retain fixed session integrity failure evidence
on:
  push:
    branches: [review/wp06-session-integrity-failure-retention-20260916]
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Copy only the already-reviewed immutable synthetic proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=061a55703197cc526f3d707d9da58b971c582e0b
          REF=refs/heads/review/wp06-session-integrity-raw-20260916
          gh api repos/wmqfl861/polymarket-alpha-lab/actions/artifacts/10454376988/zip > "$RUNNER_TEMP/proof.zip"
          echo "625166f4411e018f16d38af6825af32eeff49fdf7ac43df4a6bcd05f23d54d0f  $RUNNER_TEMP/proof.zip" | sha256sum --check
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'],'proof.zip')
          assert archive.stat().st_size==25986
          expected={
              'native-proof.log':(44527,'f3b6db366d28ce9a4cb54158c19af683f32467d35babd999da22588f398e5d68'),
              'native-proof.xml':(247780,'3edbadb998244f94db0791517513101f0a06117ea4bf369a17e3a5f9bda80ba1')}
          dest=Path('docs/reviews/wp06-session-bundle-integrity-20260916')
          assert not dest.exists()
          dest.mkdir(parents=True)
          with zipfile.ZipFile(archive) as source:
              assert source.testzip() is None and set(source.namelist())==set(expected)
              assert len(source.namelist())==2
              for name,(size,checksum) in expected.items():
                  raw=source.read(name)
                  assert len(raw)==size and hashlib.sha256(raw).hexdigest()==checksum
                  target=dest/('native-research-first'+Path(name).suffix)
                  with target.open('xb') as stream: stream.write(raw)
          PY
          git add -- docs/reviews/wp06-session-bundle-integrity-20260916/native-research-first.log docs/reviews/wp06-session-bundle-integrity-20260916/native-research-first.xml
          test "$(git diff --cached --name-only "$BASE" | wc -l)" -eq 2
          git diff --cached --exit-code "$BASE" -- src scripts tests database supabase .github DELIVERY_PLAN.md pyproject.toml uv.lock
          test -z "$(git ls-remote --heads origin "$REF")"
          export GIT_AUTHOR_NAME='Project review evidence'
          export GIT_AUTHOR_EMAIL='review@localhost'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m 'Retain exact PR49 failed research log and JUnit; not acceptance or merge')
          git push origin "$COMMIT:$REF"
          printf 'commit=%s\ntree=%s\n' "$COMMIT" "$TREE" > "$RUNNER_TEMP/retention.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-failure-retention
          path: ${{ runner.temp }}/retention.txt
          retention-days: 7
          if-no-files-found: error

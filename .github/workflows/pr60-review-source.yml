name: Pinned review source
on:
  push:
    branches: ['audit/pr60-review-source-20260919']
    paths: ['.github/workflows/pr60-review-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cbf2d3b1baff46c1a9b1e5f2983984837c8e6786
          persist-credentials: false
      - name: Archive pinned committed source without running project code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cbf2d3b1baff46c1a9b1e5f2983984837c8e6786
          test "$(git rev-parse HEAD^{tree})" = 2ff58d2edfd5b43bef7c4117b0ac5e0261c6b25f
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/review-source/source.tar.gz"
          git ls-tree -rz --full-tree HEAD > "$RUNNER_TEMP/review-source/tree.z"
          git cat-file commit HEAD > "$RUNNER_TEMP/review-source/commit.txt"
          cd "$RUNNER_TEMP/review-source"
          sha256sum source.tar.gz tree.z commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source-cbf2d3b1
          path: ${{ runner.temp }}/review-source/
          retention-days: 7
          if-no-files-found: error

name: Engineering local research capture proof
on:
  push:
    branches: [engineering/research-capture-proof-20260912]
permissions:
  contents: write
jobs:
  finalize-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: polymarket_research_capture_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polymarket_research_capture_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out exact candidate, not arbitrary PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8d4b65ce3253918148a77a5722bb7eb64f86134
          persist-credentials: true
      - name: Apply one exact connector-inventory entry and fast-forward feature branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path
          p = Path('tests/test_database_persistence_iron_rule.py')
          old = p.read_bytes()
          def blob(raw):
              return sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob(old) == '655258f8d1759b68ca0a3e273df8f26efb1c02c3'
          anchor = b'FROZEN_CONNECTOR_ALLOWLIST = frozenset((\n'
          assert old.count(anchor) == 1
          new = old.replace(anchor, anchor + b'    "src/polymarket_alpha_lab/research_capture_psycopg.py",\n', 1)
          assert blob(new) == '19571d88a9b3f98d13324feca8630fa4819efc8b'
          p.write_bytes(new)
          PY
          git add tests/test_database_persistence_iron_rule.py
          git diff --cached --check
          test "$(git write-tree)" = '60fef9ce1eee54cc6481a915386e8e9d8304452d'
          test "$(git ls-remote origin refs/heads/feature/research-capture-20260912 | cut -f1)" = 'f8d4b65ce3253918148a77a5722bb7eb64f86134'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: register the reviewed local research capture connector'
          git push origin HEAD:refs/heads/feature/research-capture-20260912
          git rev-parse HEAD
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install existing locked Postgres and test extras
        run: uv sync --locked --extra dev --extra postgres --python 3.12
      - name: Prove real local PostgreSQL capture and readback
        shell: bash
        env:
          POLYMARKET_ALPHA_LAB_RUN_RESEARCH_CAPTURE_DISPOSABLE_DB: '1'
          POLYMARKET_ALPHA_LAB_RESEARCH_CAPTURE_DB_DSN: postgresql://postgres@127.0.0.1:54322/polymarket_research_capture_test
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q -s tests/test_research_capture_disposable.py tests/test_research_capture_codec.py tests/test_research_capture_psycopg.py --junitxml="$RUNNER_TEMP/capture-proof.xml" 2>&1 | tee "$RUNNER_TEMP/capture-proof.log"
          git diff --check
          git diff --exit-code
      - name: Publish proof logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-capture-postgres-proof
          path: |
            ${{ runner.temp }}/capture-proof.log
            ${{ runner.temp }}/capture-proof.xml
          retention-days: 7
          if-no-files-found: ignore

name: Publish checked profile coverage correction
on:
  push:
    branches: ['audit/wp02-profile-filter-publish-20260919']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify plain patch and exact source tree; execute no project code
        shell: bash
        run: |
          set -euo pipefail
          cp staging/profile-filter.patch "$RUNNER_TEMP/profile-filter.patch"
          cp .github/workflows/native-distribution.yml "$RUNNER_TEMP/approved-workflow.yml"
          git switch --detach 642d1ec59111ddc1c38e519c05ef9f7e8b51a684
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = temp/'profile-filter.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '8441aafde090dbdc051b930204b8285ae5ba15d81d4612d5d103f28e91e36a5b'
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          workflow = pathlib.Path('.github/workflows/native-distribution.yml')
          data = (temp/'approved-workflow.yml').read_bytes()
          assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest() == '0ceb5b5d85ad08add92860f86b487b01f5c39720'
          workflow.write_bytes(data)
          subprocess.run(['git','add',str(workflow)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '72e74c6e978ab1ad0352de70abb6609ff34211f0'
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths) == {str(workflow),'DELIVERY_PLAN.md','docs/research-local-agent.md','tests/test_research_codex_profile_review.py'}
          entries = []
          for name in paths:
              if name == str(workflow): continue
              path = pathlib.Path(name)
              assert not name.startswith('.github/') and path.is_file() and not path.is_symlink()
              entries.append(dict(path=name,mode='100644',type='blob',content=path.read_text(encoding='utf-8')))
          assert len(entries) == 3
          (temp/'tree-request.json').write_text(json.dumps(dict(base_tree='77f2b247b761a7895d07c36195f26ba0325149ef',tree=entries)),encoding='utf-8')
          print('reviewed_tree=72e74c6e978ab1ad0352de70abb6609ff34211f0')
          PY
      - name: Publish ordinary objects only; no ref, main or workflow writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST repos/wmqfl861/polymarket-alpha-lab/git/trees --input "$RUNNER_TEMP/tree-request.json" > "$RUNNER_TEMP/tree-result.json"
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'tree-result.json').read_text())
          assert result['sha'] == '72e74c6e978ab1ad0352de70abb6609ff34211f0'
          print('published_tree='+result['sha'])
          PY

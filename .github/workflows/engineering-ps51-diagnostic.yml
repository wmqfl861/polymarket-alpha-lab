name: Engineering PS51 fixture diagnostic
on:
  push:
    branches: [engineering/pr17-ps51-diagnostic-20260913]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7a6f19ed4ef5e9cbc0d838db3da6ff72f08c3cb
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked --extra dev --python 3.12
      - name: Exact corrected loader in PS5.1 and PS7, synthetic transport only
        shell: pwsh
        run: |
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONUTF8 = '1'
          .\.venv\Scripts\python.exe -m pytest -q -ra tests/test_handoff_download.py --junitxml="$env:RUNNER_TEMP/ps51-fixed.xml" 2>&1 | Tee-Object "$env:RUNNER_TEMP/ps51-fixed.log"
          exit $LASTEXITCODE
      - name: Confirm source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ps51-fixed-proof
          path: |
            ${{ runner.temp }}/ps51-fixed.log
            ${{ runner.temp }}/ps51-fixed.xml
          retention-days: 7
          if-no-files-found: error

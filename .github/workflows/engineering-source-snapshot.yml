name: Engineering source snapshot
on:
  push:
    branches: [engineering/source-snapshot-20260912]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7b4c455a64bd5e29811304fd0ddc64c35bab2ee3
          persist-credentials: false
      - name: Archive the pinned public tracked tree only
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-source-7b4c455
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/commit.txt
            ${{ runner.temp }}/tree.txt
          retention-days: 1
          if-no-files-found: error

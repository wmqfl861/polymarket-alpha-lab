name: Supplied CLI handoff syntax only
on:
  push:
    branches: ['handoff/wp02-claude-cli-probe-20260920']
    paths:
      - 'docs/handoffs/2026-09-20-claude-cli-probe.md'
      - 'docs/handoffs/2026-09-20-claude-cli-probe.manifest.json'
      - '.github/workflows/claude-probe-handoff-syntax.yml'
permissions:
  contents: read
jobs:
  syntax-only:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          # Match the handoff's explicit checkout policy; do not hash CRLF
          # conversions of reviewed LF source bytes as if they were original.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Parse pinned ASCII examples with Windows PowerShell 5.1; never execute them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'PowerShell 5.1 required' }
          $doc = 'docs/handoffs/2026-09-20-claude-cli-probe.md'
          $manifest = 'docs/handoffs/2026-09-20-claude-cli-probe.manifest.json'
          if ((Get-Item $doc).Length -ne 13353 -or (Get-FileHash -Algorithm SHA256 $doc).Hash.ToLowerInvariant() -cne '22ca3f22222b845c944d791ec288ce06d7b252feab7fe05c4f04e25f1c6a0ff9') { throw 'Prompt bytes changed' }
          if ((Get-Item $manifest).Length -ne 1526 -or (Get-FileHash -Algorithm SHA256 $manifest).Hash.ToLowerInvariant() -cne '60af794588687f39255307d201b4af96918989c086ff6eb8266e733a6e052d23') { throw 'Manifest bytes changed' }
          $m = Get-Content $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($f in $m.files) {
              if ((Get-Item -LiteralPath $f.path).Length -ne $f.bytes -or (Get-FileHash -Algorithm SHA256 -LiteralPath $f.path).Hash.ToLowerInvariant() -cne $f.sha256) { throw 'Referenced source bytes changed' }
          }
          $text = Get-Content $doc -Raw -Encoding UTF8
          $blocks = [regex]::Matches($text, '(?s)```powershell\r?\n(.*?)```')
          if ($blocks.Count -ne 2) { throw 'Expected two code blocks' }
          foreach ($block in $blocks) {
              $code = $block.Groups[1].Value
              if ($code -match '[^\x00-\x7F]') { throw 'Executable example is not ASCII' }
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -ne 0) { $parseErrors | Format-List; throw 'Invalid example syntax' }
          }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput('if (', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -eq 0) { throw 'Parser negative control failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace error' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source changed' }
          @{status='handoff_syntax_verified'; blocks=2; powershell_version=$PSVersionTable.PSVersion.ToString(); examples_executed=$false; official_cli_executed=$false} | ConvertTo-Json

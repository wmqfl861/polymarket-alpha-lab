name: WP02 pinned upstream contract inputs
on:
  push:
    branches: ['audit/wp02-source-20260919']
    paths: ['.github/workflows/wp02-upstream-contract.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/codex
          ref: be2951ea34f0d295ed0becf97079f92fa5f6950e
          persist-credentials: false
      - name: Archive pinned public source and verified release input; do not run agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-contract"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/upstream-contract/codex-source.tar.gz"
          git ls-tree -rz --full-tree HEAD > "$RUNNER_TEMP/upstream-contract/tree.z"
          git cat-file commit HEAD > "$RUNNER_TEMP/upstream-contract/commit.txt"
          python - <<'PY'
          import os, pathlib, json, urllib.request, hashlib
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'upstream-contract'
          url = 'https://api.github.com/repos/openai/codex/releases/tags/rust-v0.155.1'
          with urllib.request.urlopen(url, timeout=30) as response:
              release = json.load(response)
          assert release['id'] == 391752266 and release['tag_name'] == 'rust-v0.155.1'
          name = 'codex-x86_64-unknown-linux-musl.tar.gz'
          asset, = [a for a in release['assets'] if a['name'] == name]
          assert asset['browser_download_url'] == 'https://github.com/openai/codex/releases/download/rust-v0.155.1/'+name
          raw = urllib.request.urlopen(asset['browser_download_url'], timeout=60).read()
          assert len(raw) == asset['size']
          assert 'sha256:'+hashlib.sha256(raw).hexdigest() == asset['digest']
          (out/name).write_bytes(raw)
          (out/'asset.json').write_text(json.dumps({k:asset[k] for k in ('id','name','size','digest','browser_download_url')}, sort_keys=True)+'\n')
          PY
          cd "$RUNNER_TEMP/upstream-contract"
          sha256sum *.gz tree.z commit.txt asset.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-contract-be2951e
          path: ${{ runner.temp }}/upstream-contract/
          retention-days: 7
          if-no-files-found: error

              "tests/test_research_dispatch_cli_review.py",
              "tests/test_project_postgres_dispatch_cli_native.py",
              "tests/test_research_resolution_confirmation.py",
              "tests/test_research_resolution_confirmation_review.py",
              "tests/test_project_postgres_confirmation_native.py",
              "tests/test_ci_thread_dump.py",
              "tests/test_ci_thread_dump_review.py",
              "tests/test_research_resolution_output.py",
              "tests/test_research_resolution_output_review.py",
              "tests/test_research_dispatch_cli_admission.py",
              "tests/test_research_dispatch_cli_admission_review.py",
              "tests/test_research_uncapped.py",
              "tests/test_research_codex_exec.py",
              "tests/test_research_codex_uncapped_review.py",
              "tests/test_project_postgres_uncapped_native.py",
              "tests/test_research_uncapped_audit.py",
              "tests/test_research_uncapped_audit_review.py",
              "tests/test_project_postgres_uncapped_audit_native.py",
              "tests/test_research_process.py",
              "tests/test_research_process_review.py",
              "tests/test_research_codex_process.py",
              "tests/test_research_codex_profile.py",
              "tests/test_research_codex_profile_review.py",
              "tests/test_research_claude_exec.py",
              "tests/test_research_claude_profile.py",
              "tests/test_research_claude_review.py",
              "tests/test_claude_cli_probe.py",
              "tests/test_claude_cli_probe_review.py"
            ]
          }
        ]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The version-switch proof extracts a pinned historical commit; the
          # shallow default checkout lacks that history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install locked Python environment
        run: uv sync --locked --extra dev --extra postgres --python 3.12
      - name: Prove isolated native partition
        env:
          NATIVE_TEST_FILES: ${{ join(matrix.files, ' ') }}
        shell: pwsh
        run: |
          # This path supplies binaries ONLY. No installed data/role/password is used.
          $env:POLYMARKET_ALPHA_LAB_NATIVE_PG_PREFIX = 'C:\Program Files\PostgreSQL\17'
          $env:POLYMARKET_ALPHA_LAB_RUN_NATIVE_PROJECT_POSTGRES = '1'
          $env:POLYMARKET_ALPHA_LAB_RUN_NATIVE_BACKUP = '1'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONUTF8 = '1'
          $env:PAL_REQUIRE_HANDOFF_SHELLS = '1'
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PG*' } | ForEach-Object { Remove-Item ('Env:' + $_.Name) }
          $testFiles = $env:NATIVE_TEST_FILES -split ' '
          .\.venv\Scripts\python.exe -u -m pytest -p no:faulthandler -p tests.ci_thread_dump -q -s -o junit_family=legacy -o faulthandler_timeout=120 @testFiles --durations=20 --junitxml="$env:RUNNER_TEMP/native-proof.xml" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-proof.log"
          $code = $LASTEXITCODE
          exit $code
      - name: Prove native version switch
        # Direct invocation of the opt-in OLD->CURRENT switch proof. The closed
        # matrix inventory above stays unchanged; this step is storage-only.
        if: matrix.partition == 'storage'
        env:
          # This path supplies binaries ONLY. No installed data/role/password is used.
          POLYMARKET_ALPHA_LAB_NATIVE_PG_PREFIX: 'C:\Program Files\PostgreSQL\17'
        shell: pwsh
        run: |
          $env:POLYMARKET_ALPHA_LAB_RUN_NATIVE_PROJECT_POSTGRES = '1'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONUTF8 = '1'
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PG*' } | ForEach-Object { Remove-Item ('Env:' + $_.Name) }
          .\.venv\Scripts\python.exe -u -m pytest -q -s -o junit_family=legacy tests/test_project_postgres_version_switch_native.py --durations=20 --junitxml="$env:RUNNER_TEMP/version-switch-proof.xml" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/version-switch-proof.log"
          $code = $LASTEXITCODE
          exit $code
      - name: Verify tracked source unchanged
        run: |
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-postgres-proof-${{ matrix.partition }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-proof.log
            ${{ runner.temp }}/native-proof.xml
            ${{ runner.temp }}/version-switch-proof.log
            ${{ runner.temp }}/version-switch-proof.xml
          retention-days: 7
          if-no-files-found: error

  # Preserve the original required-check name, but never accept a skipped,
  # cancelled or failed matrix. There is no success fallback.
  windows-native:
    if: false  # retired 2026-09-28 with windows-native-part (skipped input fails an always() gate)
    needs: [windows-native-part]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every native partition
        env:
          NATIVE_RESULT: ${{ needs.windows-native-part.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NATIVE_RESULT" = success
  # Section 61 (2026-09-27): Linux is the sole V1 platform. This real Linux
  # matrix runs the same closed native inventory under the pinned PG18 tuple.
  # The frozen Windows jobs above stay byte-identical as history; required
  # contexts are replaced only through the coordinator's controlled settings
  # step, never by this file.
  linux-native-part:
    name: linux-native-${{ matrix.partition }}
    strategy:
      # All partitions must run; failure never cancels sibling evidence.
      fail-fast: false
      matrix:
        include: [
          {
            "partition": "storage",
            "files": [
              "tests/test_project_postgres.py",
              "tests/test_project_postgres_platform.py",
              "tests/test_project_postgres_publication.py",

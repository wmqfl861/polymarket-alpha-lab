              "tests/test_research_resolution.py",
              "tests/test_research_resolution_store.py",
              "tests/test_research_resolution_cli.py",
              "tests/test_research_resolution_inspection_cli.py",
              "tests/test_research_resolution_queue.py",
              "tests/test_research_resolution_poll.py",
              "tests/test_project_postgres_resolution_queue_native.py",
              "tests/test_research_crypto_launch.py",
              "tests/test_crypto_contract_scope.py",
              "tests/test_crypto_observation_time.py",
              "tests/test_research_evidence_timezones.py",
              "tests/test_research_scope_instants.py",
              "tests/test_research_record_timezone_codec.py",
              "tests/test_project_postgres_crypto_launch_native.py",
              "tests/test_public_http.py",
              "tests/test_research_crypto_discovery.py",
              "tests/test_crypto_supported_selection.py",
              "tests/test_handoff_download.py",
              "tests/test_research_evaluation_cli.py",
              "tests/test_research_execution_cli.py",
              "tests/test_research_execution_inventory.py",
              "tests/test_research_inventory_cli.py",
              "tests/test_project_postgres_inventory_native.py"
            ]
          },
          {
            "partition": "dispatch",
            "files": [
              "tests/test_research_dispatch.py",
              "tests/test_project_postgres_dispatch_native.py",
              "tests/test_research_dispatch_rotation.py",
              "tests/test_project_postgres_rotation_native.py",
              "tests/test_research_model_budget.py",
              "tests/test_project_postgres_budget_native.py",
              "tests/test_research_dispatch_cli.py",
              "tests/test_research_dispatch_cli_review.py",
              "tests/test_project_postgres_dispatch_cli_native.py",
              "tests/test_research_resolution_confirmation.py",
              "tests/test_research_resolution_confirmation_review.py",
              "tests/test_project_postgres_confirmation_native.py",
              "tests/test_ci_thread_dump.py",
              "tests/test_ci_thread_dump_review.py",
              "tests/test_research_resolution_output.py",
              "tests/test_research_resolution_output_review.py",
              "tests/test_research_dispatch_cli_admission.py",
              "tests/test_research_dispatch_cli_admission_review.py",
              "tests/test_research_uncapped.py",
              "tests/test_research_codex_exec.py",
              "tests/test_research_codex_uncapped_review.py",
              "tests/test_project_postgres_uncapped_native.py",
              "tests/test_research_uncapped_audit.py",
              "tests/test_research_uncapped_audit_review.py",
              "tests/test_project_postgres_uncapped_audit_native.py",
              "tests/test_research_process.py",
              "tests/test_research_process_review.py",
              "tests/test_research_codex_process.py",
              "tests/test_research_codex_profile.py",
              "tests/test_research_codex_profile_review.py",
              "tests/test_research_claude_exec.py",
              "tests/test_research_claude_profile.py",
              "tests/test_research_claude_review.py",
              "tests/test_claude_cli_probe.py",
              "tests/test_claude_cli_probe_review.py"
            ]
          },
          {
            "partition": "papersim",
            "files": [
              "tests/test_papersim_ledger.py",
              "tests/test_papersim_perf_view_fix.py",
              "tests/test_papersim_store.py",
              "tests/test_papersim_store_native.py",
              "tests/test_papersim_migrations.py",
              "tests/test_papersim_import_legacy.py",
              "tests/test_papersim_cli.py",
              "tests/test_papersim_snapshots.py",
              "tests/test_papersim_replay.py",
              "tests/test_papersim_m2_migrations.py",
              "tests/test_papersim_m2_store_native.py",
              "tests/test_papersim_queue_policy_native.py"
            ]
          }
        ]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The version-switch proof extracts a pinned historical commit; the
          # shallow default checkout lacks that history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install locked Python environment
        run: uv sync --locked --extra dev --extra postgres --python 3.12
      - name: Assemble the qualified PG18 portable prefix
        # Qualified package-to-prefix assembly (section 50/61 pattern): the
        # pinned apt postgresql-18 package supplies binaries ONLY. No installed
        # cluster, data directory, role or password from the package is used.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --no-progress-meter \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --retry-max-time 180 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-18
          PREFIX="$RUNNER_TEMP/pg18-portable-prefix"
          mkdir -p "$PREFIX"
          # -L dereferences: PGDG's 24.04 layout ships development symlinks the
          # symlink-free prefix contract must not contain; broken links fail loudly.
          cp -aL /usr/lib/postgresql/18/bin "$PREFIX/bin"
          cp -aL /usr/lib/postgresql/18/lib "$PREFIX/lib"
          cp -aL /usr/share/postgresql/18 "$PREFIX/share"
          cp /usr/share/doc/postgresql-18/copyright "$PREFIX/COPYRIGHT"
          find "$PREFIX" -type l -ls
          test "$(find "$PREFIX" -type l | wc -l)" -eq 0
          test -x "$PREFIX/bin/postgres" && test -f "$PREFIX/share/postgres.bki"
          "$PREFIX/bin/postgres" --version
      - name: Assemble throwaway papersim cluster
        # FX-07 partition 4: one-shot loopback paper_sim cluster built from
        # the SAME pinned PG18 prefix above. Binaries only -- no installed
        # cluster, role or password is used. The verbatim checked-in ledger
        # migration is applied so the opt-in integration checks see the real
        # relations; the offline papersim face stays in offline-verification.
        if: matrix.partition == 'papersim'
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/pg18-portable-prefix"
          DATA="$RUNNER_TEMP/papersim-pgdata"
          "$PREFIX/bin/initdb" -U paper_sim -D "$DATA" --no-locale --encoding=UTF8
          "$PREFIX/bin/pg_ctl" -D "$DATA" -l "$RUNNER_TEMP/papersim-pg.log" start -o "-p 55432 -h 127.0.0.1 -k $RUNNER_TEMP"
          "$PREFIX/bin/createdb" -h 127.0.0.1 -p 55432 -U paper_sim paper_sim
          "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261101000000_papersim_ledger.sql
          # FX-09L: mount the archived legacy history fixture into the
          # throwaway legacy face (the source CSVs are read-only repo
          # files) so the importer's read-only re-observation, baseline
          # registration and catalog-fingerprint proofs run on the same
          # data as the offline dry-run contracts.
          "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -v ON_ERROR_STOP=1 -c "\copy public.decisions (id,ts,market_id,question,side,price,shares,stake,fair_low,fair_high,spot,vol,horizon_days,sizing,reason,team,model_prediction,market_type) from 'docs/paper-sim/ledger-snapshots/2026-11-12/decisions.csv' with (format csv, header true)"
          "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -v ON_ERROR_STOP=1 -c "\copy public.resolutions from 'docs/paper-sim/ledger-snapshots/2026-11-12/resolutions.csv' with (format csv, header true)"
          "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -v ON_ERROR_STOP=1 -c "\copy public.bankroll from 'docs/paper-sim/ledger-snapshots/2026-11-12/bankroll.csv' with (format csv, header true)"
          printf 'PAPERSIM_PG_DSN=postgresql://paper_sim@127.0.0.1:55432/paper_sim\n' >> "$GITHUB_ENV"
          printf 'WP_P4_READONLY_PG=1\n' >> "$GITHUB_ENV"
          # FX-09S: assemble the papersim MANAGED face on the same throwaway
          # cluster: dedicated roles, the project database and the V1
          # bootstrap (identity + migration ledger) generated via python.
          # The papersim catalog itself is applied by the tests through the
          # applier with the validated socket trust DSNs exported below.
          "$PREFIX/bin/createuser" -h 127.0.0.1 -p 55432 -U paper_sim pal_owner
          "$PREFIX/bin/createuser" -h 127.0.0.1 -p 55432 -U paper_sim pal_app
          # M1 CI fix (native run 43741792178): the opt-in migration proofs
          # create one throwaway database per test (CREATE DATABASE ...
          # OWNER pal_owner); without CREATEDB the CI cluster rejects them
          # with InsufficientPrivilege (the dev-server face reaches its
          # cluster as a socket-trust superuser, which masked this).
          "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -v ON_ERROR_STOP=1 -q -c "ALTER ROLE pal_owner CREATEDB"
          "$PREFIX/bin/createdb" -h 127.0.0.1 -p 55432 -U paper_sim -O pal_owner polymarket_alpha_lab
          SYSTEM_ID="$("$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U paper_sim -d paper_sim -tA -c "SELECT system_identifier FROM pg_control_system()")"
          .venv/bin/python - "$SYSTEM_ID" <<'PY' | "$PREFIX/bin/psql" -h 127.0.0.1 -p 55432 -U pal_owner -d polymarket_alpha_lab -v ON_ERROR_STOP=1 -q -f -
          import sys, uuid
          from pathlib import Path
          from polymarket_alpha_lab.project_postgres import sql
          from polymarket_alpha_lab.project_postgres.files import Layout
          layout = Layout(Path(".").resolve())
          print(sql.bootstrap_sql(uuid.uuid4().hex, layout.root_hash, sys.argv[1]), end="")
          PY
          printf 'PAPERSIM_NATIVE_MANAGED_OWNER_DSN=host=%s port=55432 dbname=polymarket_alpha_lab user=pal_owner\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PAPERSIM_NATIVE_MANAGED_APP_DSN=host=%s port=55432 dbname=polymarket_alpha_lab user=pal_app\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prove isolated native partition
        env:
          NATIVE_TEST_FILES: ${{ join(matrix.files, ' ') }}
        run: |
          set -euo pipefail
          # This prefix supplies binaries ONLY. No installed data/role/password is used.
          export POLYMARKET_ALPHA_LAB_NATIVE_PG_PREFIX="$RUNNER_TEMP/pg18-portable-prefix"
          export POLYMARKET_ALPHA_LAB_RUN_NATIVE_PROJECT_POSTGRES=1
          export POLYMARKET_ALPHA_LAB_RUN_NATIVE_BACKUP=1
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export PYTHONUTF8=1
          export PAL_REQUIRE_HANDOFF_SHELLS=1
          for variable in $(compgen -e PG); do unset "$variable"; done
          .venv/bin/python -u -m pytest -p no:faulthandler -p tests.ci_thread_dump -q -s -o junit_family=legacy -o faulthandler_timeout=120 $NATIVE_TEST_FILES --durations=20 --junitxml="$RUNNER_TEMP/native-proof.xml" 2>&1 | tee "$RUNNER_TEMP/native-proof.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Prove native version switch
        # Direct invocation of the opt-in OLD->CURRENT Linux switch proof. The
        # closed matrix inventory above stays unchanged; this step is
        # storage-only. The Windows PG17 run above remains frozen history (§55).
        if: matrix.partition == 'storage'
        run: |
          set -euo pipefail
          # This prefix supplies binaries ONLY. No installed data/role/password is used.
          export POLYMARKET_ALPHA_LAB_NATIVE_PG_PREFIX="$RUNNER_TEMP/pg18-portable-prefix"
          export POLYMARKET_ALPHA_LAB_RUN_NATIVE_PROJECT_POSTGRES=1
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export PYTHONUTF8=1
          for variable in $(compgen -e PG); do unset "$variable"; done
          .venv/bin/python -u -m pytest -q -s -o junit_family=legacy tests/test_project_postgres_version_switch_native.py --durations=20 --junitxml="$RUNNER_TEMP/version-switch-proof.xml" 2>&1 | tee "$RUNNER_TEMP/version-switch-proof.log"
          test ${PIPESTATUS[0]} -eq 0
      - name: Verify tracked source unchanged
        run: |
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-postgres-linux-proof-${{ matrix.partition }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-proof.log
            ${{ runner.temp }}/native-proof.xml
            ${{ runner.temp }}/version-switch-proof.log
            ${{ runner.temp }}/version-switch-proof.xml
          retention-days: 7
          if-no-files-found: error

  # Linux required-check aggregate: never accept a skipped, cancelled or
  # failed matrix partition. There is no success fallback and no error
  # suppression anywhere in this workflow.
  linux-native:
    if: ${{ always() }}
    needs: [linux-native-part]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every native partition
        env:
          NATIVE_RESULT: ${{ needs.linux-native-part.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NATIVE_RESULT" = success

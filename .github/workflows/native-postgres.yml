  # FX-07 (2026-11-12): this repository works by direct pushes to main, so a
  # pull_request-only trigger left the real-Postgres matrix unrun. Push now
  # runs it for the database-facing surfaces. The schedule is weekly, never
  # daily: the four partitions together cost tens of minutes and
  # private-repository minutes are quota-limited.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'database/**'
      - 'src/polymarket_alpha_lab/project_postgres/**'
      - 'src/polymarket_alpha_lab/*_psycopg.py'
      - 'src/polymarket_alpha_lab/papersim/**'
      - 'tests/test_project_postgres*'
      - 'tests/test_papersim_*'
      - '.github/workflows/native-postgres.yml'

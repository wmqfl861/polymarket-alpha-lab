name: Pinned separate-target review source
on:
  push:
    branches: [review/wp06-separate-target-source-20260919]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8ae414ad56146facdcf7e1369ca40730b69476e6
          persist-credentials: false
      - name: Archive tracked source without executing it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8ae414ad56146facdcf7e1369ca40730b69476e6
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/source-commit.txt"
          sha256sum "$RUNNER_TEMP/source.zip" > "$RUNNER_TEMP/source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-8ae414ad
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source.sha256
          retention-days: 7
          if-no-files-found: error

name: Operator flow fixed source
on:
  push:
    branches: [review/wp06-operator-source-20260916]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0c438098bab4d7c0a4f626664af43a31d96d8b08
          persist-credentials: false
      - name: Archive pinned tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0c438098bab4d7c0a4f626664af43a31d96d8b08
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD src tests scripts database supabase/migrations docs .github/workflows AGENTS.md DELIVERY_PLAN.md README.md pyproject.toml uv.lock .gitattributes .gitignore .env.example strategy.example.json strategy.example.phase1-screening.json
          sha256sum "$RUNNER_TEMP/source.zip" > "$RUNNER_TEMP/source.sha256"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-0c438098
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/source.sha256
            ${{ runner.temp }}/source-tree.txt
          retention-days: 7
          if-no-files-found: error

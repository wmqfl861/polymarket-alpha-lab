[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-alpha-lab"
version = "0.1.0"
description = "Research-first Polymarket market screening, paper trading, and risk analysis workspace."
requires-python = ">=3.12"
dependencies = ["tzdata>=2026.2"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
polymarket-alpha-lab = "polymarket_alpha_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# FX-22 first item (2026-11-12): a SyntaxWarning anywhere in the collected
# suite fails the run. Deliberately SyntaxWarning-only; no other warning
# category is promoted to an error.
filterwarnings = ["error::SyntaxWarning"]
